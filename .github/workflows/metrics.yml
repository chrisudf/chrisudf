# OPTIONAL — needs a classic PAT with `public_repo` scope saved as the
# repo secret METRICS_TOKEN. Without it every step is skipped, so the
# workflow is harmless if you never set it up.
#
# It commits assets/metrics.svg back to main; drop this into README.md to use it:
#   <img src="assets/metrics.svg" width="100%" alt="metrics" />

name: generate metrics panel

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  metrics:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}

    steps:
      - name: isometric calendar + languages
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Australia/Brisbane
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_lines: yes
