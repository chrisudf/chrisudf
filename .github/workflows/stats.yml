name: regenerate stats card

on:
  schedule:
    - cron: "15 18 * * *" # 04:15 Brisbane
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/gen_stats.py
      - .github/workflows/stats.yml

jobs:
  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: render assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_stats.py "${{ github.repository_owner }}" assets/stats.svg

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats card"
          git push
