<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 12" width="1000" height="12" role="img" aria-label="divider">
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7b2fff" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#7b2fff" stop-opacity=".9"/>
      <stop offset="50%"  stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#ff00a0" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff00a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-20%" y="-400%" width="140%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="5" width="1000" height="2" fill="url(#d)" filter="url(#g)">
    <animate attributeName="opacity" values=".5;1;.5" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="-140" y="3.5" width="140" height="5" fill="#f7ff00" opacity=".85" filter="url(#g)">
    <animate attributeName="x" values="-140;1000" dur="3.6s" repeatCount="indefinite"/>
  </rect>
</svg>
