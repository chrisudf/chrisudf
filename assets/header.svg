<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="CHRIS QIU - quant tooling and applied AI">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0118"/>
      <stop offset="55%"  stop-color="#12042b"/>
      <stop offset="100%" stop-color="#1b0033"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f7ff00"/>
      <stop offset="45%"  stop-color="#ff00a0"/>
      <stop offset="100%" stop-color="#7b2fff"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00f0ff" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunclip"><rect x="0" y="0" width="1000" height="196"/></clipPath>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="280" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="280" fill="url(#sky)"/>

    <!-- starfield -->
    <g fill="#ffffff">
      <circle cx="120" cy="38" r="1.2" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="22" r="1"   opacity=".5"><animate attributeName="opacity" values=".8;.15;.8" dur="4.3s" repeatCount="indefinite"/></circle>
      <circle cx="680" cy="46" r="1.3" opacity=".6"><animate attributeName="opacity" values=".2;1;.2"   dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="26" r="1"   opacity=".5"><animate attributeName="opacity" values=".9;.2;.9"  dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="60" r="1.1" opacity=".4"><animate attributeName="opacity" values=".1;.7;.1"  dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="60"  cy="80" r="1"   opacity=".4"><animate attributeName="opacity" values=".7;.1;.7"  dur="4.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- synthwave sun -->
    <g clip-path="url(#sunclip)">
      <circle cx="500" cy="236" r="76" fill="url(#sun)" opacity=".9" filter="url(#glow)"/>
      <g fill="#12042b">
        <rect x="420" y="168" width="160" height="4"/>
        <rect x="420" y="178" width="160" height="5"/>
        <rect x="420" y="189" width="160" height="7"/>
      </g>
    </g>

    <!-- perspective grid floor -->
    <g stroke="#ff00a0" stroke-width="1" opacity=".55">
      <line x1="-260" y1="280" x2="440" y2="196"/><line x1="-80" y1="280" x2="462" y2="196"/>
      <line x1="110"  y1="280" x2="482" y2="196"/><line x1="300" y1="280" x2="492" y2="196"/>
      <line x1="500"  y1="280" x2="500" y2="196"/><line x1="700" y1="280" x2="508" y2="196"/>
      <line x1="890"  y1="280" x2="518" y2="196"/><line x1="1080" y1="280" x2="538" y2="196"/>
      <line x1="1260" y1="280" x2="560" y2="196"/>
    </g>
    <g stroke="#00f0ff" stroke-width="1.2" opacity=".5">
      <line x1="0" y1="196" x2="1000" y2="196"/>
      <line x1="0" y1="204" x2="1000" y2="204"><animate attributeName="y1" values="196;280" dur="4s" repeatCount="indefinite"/><animate attributeName="y2" values="196;280" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.6" dur="4s" repeatCount="indefinite"/></line>
      <line x1="0" y1="222" x2="1000" y2="222"><animate attributeName="y1" values="210;280" dur="4s" repeatCount="indefinite"/><animate attributeName="y2" values="210;280" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.7" dur="4s" repeatCount="indefinite"/></line>
      <line x1="0" y1="250" x2="1000" y2="250"><animate attributeName="y1" values="234;280" dur="4s" repeatCount="indefinite"/><animate attributeName="y2" values="234;280" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;.8" dur="4s" repeatCount="indefinite"/></line>
    </g>

    <!-- glitch title: magenta + cyan chromatic offsets under a white core -->
    <g font-family="'Courier New',ui-monospace,monospace" font-size="66" font-weight="bold" text-anchor="middle" letter-spacing="6">
      <text x="500" y="112" fill="#ff00a0" opacity=".85" filter="url(#glow)">CHRIS QIU
        <animate attributeName="x" values="500;494;503;500;500;497;500" dur="3.4s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="112" fill="#00f0ff" opacity=".85" filter="url(#glow)">CHRIS QIU
        <animate attributeName="x" values="500;506;497;500;500;503;500" dur="3.4s" repeatCount="indefinite"/>
      </text>
      <text x="500" y="112" fill="#f2f7ff">CHRIS QIU
        <animate attributeName="opacity" values="1;1;.35;1;1;.7;1;1" dur="3.4s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- glitch slice bars -->
    <g opacity=".9">
      <rect x="300" y="86" width="400" height="4" fill="#f7ff00" opacity="0">
        <animate attributeName="opacity" values="0;0;.9;0;0;0;0" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="300;340;280;300" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="330" y="100" width="340" height="3" fill="#00f0ff" opacity="0">
        <animate attributeName="opacity" values="0;0;0;0;.8;0;0" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="330;300;360;330" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="500" y="146" text-anchor="middle" font-family="'Courier New',ui-monospace,monospace" font-size="16"
          fill="#00f0ff" letter-spacing="7" filter="url(#softglow)">QUANT&#160;TOOLING&#160;&#160;//&#160;&#160;APPLIED&#160;AI&#160;&#160;//&#160;&#160;夜之城</text>

    <rect x="330" y="158" width="340" height="2" fill="url(#fade)">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
    </rect>

    <!-- corner brackets -->
    <g stroke="#f7ff00" stroke-width="2.5" fill="none" opacity=".9">
      <path d="M14 46 V14 H46"/><path d="M954 14 H986 V46"/>
      <path d="M14 234 V266 H46"/><path d="M954 266 H986 V234"/>
    </g>

    <!-- scanlines + sweep -->
    <g fill="#000000" opacity=".16">
      <rect y="0"  width="1000" height="1.5"/><rect y="4"   width="1000" height="1.5"/><rect y="8"   width="1000" height="1.5"/>
      <rect y="12" width="1000" height="1.5"/><rect y="16"  width="1000" height="1.5"/><rect y="20"  width="1000" height="1.5"/>
      <rect y="24" width="1000" height="1.5"/><rect y="28"  width="1000" height="1.5"/><rect y="32"  width="1000" height="1.5"/>
      <rect y="36" width="1000" height="1.5"/><rect y="40"  width="1000" height="1.5"/><rect y="44"  width="1000" height="1.5"/>
      <rect y="48" width="1000" height="1.5"/><rect y="52"  width="1000" height="1.5"/><rect y="56"  width="1000" height="1.5"/>
      <rect y="60" width="1000" height="1.5"/><rect y="64"  width="1000" height="1.5"/><rect y="68"  width="1000" height="1.5"/>
      <rect y="72" width="1000" height="1.5"/><rect y="76"  width="1000" height="1.5"/><rect y="80"  width="1000" height="1.5"/>
      <rect y="84" width="1000" height="1.5"/><rect y="88"  width="1000" height="1.5"/><rect y="92"  width="1000" height="1.5"/>
      <rect y="96" width="1000" height="1.5"/><rect y="100" width="1000" height="1.5"/><rect y="104" width="1000" height="1.5"/>
      <rect y="108" width="1000" height="1.5"/><rect y="112" width="1000" height="1.5"/><rect y="116" width="1000" height="1.5"/>
      <rect y="120" width="1000" height="1.5"/><rect y="124" width="1000" height="1.5"/><rect y="128" width="1000" height="1.5"/>
      <rect y="132" width="1000" height="1.5"/><rect y="136" width="1000" height="1.5"/><rect y="140" width="1000" height="1.5"/>
      <rect y="144" width="1000" height="1.5"/><rect y="148" width="1000" height="1.5"/><rect y="152" width="1000" height="1.5"/>
      <rect y="156" width="1000" height="1.5"/><rect y="160" width="1000" height="1.5"/><rect y="164" width="1000" height="1.5"/>
      <rect y="168" width="1000" height="1.5"/><rect y="172" width="1000" height="1.5"/><rect y="176" width="1000" height="1.5"/>
      <rect y="180" width="1000" height="1.5"/><rect y="184" width="1000" height="1.5"/><rect y="188" width="1000" height="1.5"/>
      <rect y="192" width="1000" height="1.5"/><rect y="196" width="1000" height="1.5"/><rect y="200" width="1000" height="1.5"/>
      <rect y="204" width="1000" height="1.5"/><rect y="208" width="1000" height="1.5"/><rect y="212" width="1000" height="1.5"/>
      <rect y="216" width="1000" height="1.5"/><rect y="220" width="1000" height="1.5"/><rect y="224" width="1000" height="1.5"/>
      <rect y="228" width="1000" height="1.5"/><rect y="232" width="1000" height="1.5"/><rect y="236" width="1000" height="1.5"/>
      <rect y="240" width="1000" height="1.5"/><rect y="244" width="1000" height="1.5"/><rect y="248" width="1000" height="1.5"/>
      <rect y="252" width="1000" height="1.5"/><rect y="256" width="1000" height="1.5"/><rect y="260" width="1000" height="1.5"/>
      <rect y="264" width="1000" height="1.5"/><rect y="268" width="1000" height="1.5"/><rect y="272" width="1000" height="1.5"/>
      <rect y="276" width="1000" height="1.5"/>
    </g>
    <rect x="0" y="-60" width="1000" height="60" fill="#00f0ff" opacity=".07">
      <animate attributeName="y" values="-60;280" dur="5.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="1" y="1" width="998" height="278" rx="10" fill="none" stroke="#ff00a0" stroke-width="2" opacity=".7">
      <animate attributeName="opacity" values=".35;.85;.35" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
